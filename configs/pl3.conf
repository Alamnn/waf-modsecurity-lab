# OWASP Core Rule Set (CRS) Paranoia Level 3 Configuration
# File: configs/pl3.conf
SecRuleEngine On

SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.paranoia_level=3,\
    setvar:tx.executing_paranoia_level=3,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"
