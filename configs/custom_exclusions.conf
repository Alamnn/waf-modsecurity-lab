# ModSecurity Custom False-Positive Exclusion & Virtual Patching Rules
# File: configs/custom_exclusions.conf
#
# Example 1: Allow numeric IP Host header in local Docker / localhost:8080 testing
SecAction \
    "id:100100,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920350"

# Example 2: Fix a Paranoia Level 3 false positive on /api/feedback?comment=...
# where users submit natural-language punctuation (e.g., apostrophes or math symbols)
# without disabling SQLi/XSS inspection on any other endpoint or parameter.
SecRule REQUEST_URI "@beginsWith /api/feedback" \
    "id:100110,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942430;ARGS:comment,\
    ctl:ruleRemoveTargetById=942431;ARGS:comment"
